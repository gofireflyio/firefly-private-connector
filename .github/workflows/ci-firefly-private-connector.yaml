name: Build FIREFLY-PRIVATE-CONNECTOR Dockerhub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version Tag for the FIREFLY-PRIVATE-CONNECTOR Docker Image'
        required: true
        default: '1.0.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      with:
        cache-image: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Login to DockerHub
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get current time
      id: current-time
      run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Build and push image to prod
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
      with:
        push: true
        tags: |
          infralightio/flytube:${{ github.event.inputs.tag }}
          infralightio/flytube:latest
        labels: |
          org.opencontainers.image.created=${{ steps.current-time.outputs.time }}
          org.opencontainers.image.authors=Infralight
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ github.event.inputs.tag }}

    - name: Slack Notification
      if: ${{ success() }}
      uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
      env:
        SLACK_COLOR: ${{ job.status }}
        SLACK_ICON: https://assets-global.website-files.com/5d514fd9493b0575f03520bd/5d8e0b39fd776a3c238e8753_icons8_infinity_large_filled_2.svg
        SLACK_MESSAGE: "FIREFLY-PRIVATE-CONNECTOR image pushed to infralightio/flytube:${{ github.event.inputs.tag }}"
        SLACK_TITLE: "FIREFLY-PRIVATE-CONNECTOR image pushed to infralightio/flytube:${{ github.event.inputs.tag }}"
        SLACK_USERNAME: cicdBot
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}