name: Build FIREFLY-PRIVATE-CONNECTOR Dockerhub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version Tag for the FIREFLY-PRIVATE-CONNECTOR Docker Image'
        required: true
        default: '1.0.0'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

    - name: Set up QEMU
      uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

    - name: Login to DockerHub
      uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get current time
      uses: gerred/actions/current-time@c3950138908da5fe2b904f1dc39535d565f1547f # master
      id: current-time

    - name: Build and push image to prod
      uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2
      with:
        push: true
        tags: |
          infralightio/flytube:${{ github.event.inputs.tag }}
          infralightio/flytube:latest
        labels: |
          org.opencontainers.image.created=${{ steps.current-time.outputs.time }}
          org.opencontainers.image.authors=Infralight
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ github.event.inputs.tag }}

    - name: Slack Notification
      if: ${{ success() }}
      uses: rtCamp/action-slack-notify@cdf0a2130cbcdfd82ba5fcac8e076370bf381b36 # v2
      env:
        SLACK_COLOR: ${{ job.status }}
        SLACK_ICON: https://assets-global.website-files.com/5d514fd9493b0575f03520bd/5d8e0b39fd776a3c238e8753_icons8_infinity_large_filled_2.svg
        SLACK_MESSAGE: "FIREFLY-PRIVATE-CONNECTOR image pushed to infralightio/flytube:${{ github.event.inputs.tag }}"
        SLACK_TITLE: "FIREFLY-PRIVATE-CONNECTOR image pushed to infralightio/flytube:${{ github.event.inputs.tag }}"
        SLACK_USERNAME: cicdBot
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}